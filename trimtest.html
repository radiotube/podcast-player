<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podcast Player</title>
<meta name="description" content="Kevin's podcast player for iPhone and iPad, with video podcasts and a favorites order you set.">
<meta name="theme-color" content="#11181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Podcasts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: one-screen app. Scrolling content between a top bar and a fixed bottom stack (mini player + tab bar). */
:root{
  --bg:#11181b; --surface:#1a2327; --surface-2:#243035; --line:#2e3b41;
  --fg:#e9eef0; --muted:#97a6ac; --accent:#f2a93b; --accent-ink:#1d1405;
  --video:#7cc4e8; --good:#7fcf9a; --danger:#ef7d6d;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:-apple-system-headline,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tabh:58px; --minih:68px;
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--ui);overscroll-behavior:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.app{display:flex;flex-direction:column;height:100%}
.topbar{flex:0 0 auto;padding-top:calc(var(--sat) + 10px);padding-bottom:10px;padding-left:max(16px,var(--sal),calc((100% - 760px)/2));padding-right:max(16px,var(--sar),calc((100% - 760px)/2));display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{font:700 30px/1.1 var(--display);letter-spacing:-.01em;margin:0;flex:1;min-width:0;text-wrap:balance}
.topbar .back{display:flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-size:17px;padding:8px 4px;margin-left:-4px}
.topbar .sub-title{font:600 17px/1.2 var(--ui);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill-btn{background:var(--surface-2);border:0;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--fg);min-height:40px}
.pill-btn.on{background:var(--accent);color:var(--accent-ink)}

.scroller{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:4px calc(var(--tabh) + var(--minih) + var(--sab) + 24px)}
.view{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.section-label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.note{color:var(--muted);font-size:14px;margin:0}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:14px}

/* Favorites */
.fav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fav{background:var(--surface);border-radius:16px;padding:12px;display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;gap:12px;align-items:center;position:relative}
.fav .rank{font:600 14px var(--mono);color:var(--accent);width:22px;text-align:center;font-variant-numeric:tabular-nums}
.fav img,.show-row img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.fav .meta{min-width:0}
.fav .show-name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left;width:100%}
.fav .latest{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fav .latest b{color:var(--fg);font-weight:500}
.play-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}
.play-btn svg{width:20px;height:20px}
.play-btn.ghost{background:var(--surface-2);color:var(--fg)}
.arrange-tools{display:none;align-items:center;gap:6px}
.arranging .fav{grid-template-columns:auto 52px minmax(0,1fr) auto}
.arranging .fav img{width:52px;height:52px}
.arranging .fav .play-btn{display:none}
.arranging .arrange-tools{display:flex}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);display:grid;place-items:center}
.icon-btn:disabled{opacity:.35}
.icon-btn svg{width:20px;height:20px}
.handle{touch-action:none;cursor:grab;background:transparent;color:var(--muted)}
.fav.dragging{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5;background:var(--surface-2)}
.fav.placeholder{background:transparent;border:2px dashed var(--line)}

.show-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.show-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.show-row:last-child{border-bottom:0}
.show-row img{width:56px;height:56px}
.show-row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-row .a{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-link{background:none;border:0;padding:0;text-align:left;min-width:0;display:block;width:100%}
.star{background:none;border:0;color:var(--muted);width:44px;height:44px;display:grid;place-items:center}
.star.on{color:var(--accent)}
.star svg{width:24px;height:24px}

/* Show page */
.show-head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:end}
.show-head img{width:120px;height:120px;border-radius:14px;object-fit:cover;background:var(--surface-2)}
.show-head h2{font:700 22px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
.show-head .a{color:var(--muted);font-size:14px;margin:0 0 10px}
.show-actions{display:flex;flex-wrap:wrap;gap:8px}
.eps{list-style:none;margin:0;padding:0}
.ep{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.ep .when{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ep .title{font-weight:600;background:none;border:0;padding:0;text-align:left}
.ep.played .title{color:var(--muted);font-weight:500}
.ep .desc{grid-column:1/-1;font-size:14px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.badge.video{background:rgba(124,196,232,.16);color:var(--video)}
.badge.left{background:rgba(242,169,59,.14);color:var(--accent)}
.badge.done{background:rgba(127,207,154,.14);color:var(--good)}
.prog{grid-column:1/-1;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

/* Search & settings */
.search-box{display:flex;gap:8px}
.search-box input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px;max-width:62ch}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:46px;align-self:flex-start}
.btn.secondary{background:var(--surface-2);color:var(--fg)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.status{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status.err{color:var(--danger)}
ol.steps{margin:0;padding-left:20px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:4px}

/* Bottom stack */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,24,27,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.mini{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:10px;align-items:center;height:var(--minih);padding-left:max(12px,var(--sal));padding-right:max(12px,var(--sar));border-bottom:1px solid var(--line)}
.mini img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.mini .open{background:none;border:0;padding:0;text-align:left;min-width:0}
.mini .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{grid-column:1/-1;height:2px;margin-top:-10px;background:var(--surface-2)}
.tabs{display:flex;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* Full player */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(var(--sat) + 8px);padding-bottom:calc(var(--sab) + 16px);padding-left:max(20px,var(--sal));padding-right:max(20px,var(--sar));transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.player.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.player{transition:none}}
.player .grab{display:flex;justify-content:space-between;align-items:center}
.player .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}
.player .stage img{width:min(78vw,340px,42vh);aspect-ratio:1;border-radius:18px;object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.45);max-width:100%}
.player video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;height:auto;max-height:100%;min-height:140px;flex:0 1 auto;object-fit:contain;border-radius:12px;background:#000}
.player video[hidden]{display:none}
.player .info{text-align:center;display:flex;flex-direction:column;gap:2px;margin:0 auto;max-width:560px;width:100%}
.player .info .t{font:700 19px/1.25 var(--display);text-wrap:balance}
.player .info .s{color:var(--muted);font-size:15px}
.player .trim-info{color:var(--accent);font-size:13px;margin-top:2px}
.player .trim-info.off{color:var(--muted)}
.scrub{width:100%;max-width:560px;margin:14px auto 0}
.scrub input{width:100%;accent-color:var(--accent);height:28px}
.scrub .times{display:flex;justify-content:space-between;font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.transport{display:flex;justify-content:center;align-items:center;gap:28px;margin:8px 0 14px}
.skip{background:none;border:0;width:60px;height:60px;display:grid;place-items:center;position:relative;color:var(--fg)}
.skip svg{width:40px;height:40px}
.skip span{position:absolute;font:700 11px var(--ui);top:50%;left:50%;transform:translate(-50%,-30%)}
.big-play{width:80px;height:80px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.big-play svg{width:34px;height:34px}
.extras{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;max-width:560px;margin:0 auto}
.extras label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.extras select{background:var(--surface-2);border:0;border-radius:10px;padding:8px 10px;font-size:15px;min-height:42px;min-width:92px;text-align:center}
.extras .pill-btn{align-self:flex-end}
.sleep-left{color:var(--accent);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--minih) + var(--sab) + 14px);background:var(--surface-2);color:var(--fg);padding:10px 16px;border-radius:12px;z-index:60;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.spinner{width:22px;height:22px;border:3px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:700px){.show-head{grid-template-columns:160px minmax(0,1fr)}.show-head img{width:160px;height:160px}}

/* Subjects */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -4px;padding-inline:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--muted);min-height:40px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fav .subj{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sugg-acts{display:flex;align-items:center;gap:6px}
.sugg-acts .pill-btn{padding:8px 12px}
.icon-btn.plain{background:none;color:var(--muted);width:36px}
.show-row .a .new{color:var(--good)}
.group-label{font-size:15px;font-weight:650;margin:14px 0 2px;color:var(--fg)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.field select,.field input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--fg);min-height:44px;width:100%}
.source{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* Transcript */
.stage{flex-direction:column;gap:12px}
.player.tx .stage img{width:min(30vw,120px,18vh)}
.player.tx video{max-height:32vh}
.tx-box{display:none;flex:1 1 auto;min-height:0;width:100%;max-width:640px;overflow-y:auto;background:var(--surface);border-radius:14px;padding:6px 4px}
.player.tx .tx-box{display:block}
.cue{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:10px;font-size:17px;line-height:1.45;color:var(--muted)}
.cue.now{color:var(--fg);background:var(--surface-2)}
.cue .who{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.tx-msg{padding:16px;color:var(--muted);font-size:15px}
.tx-msg a{color:var(--accent)}

/* Episode tabs, sort and listened marks */
.ep-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;flex:1 1 220px;background:var(--surface);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;min-height:40px;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.ep-info{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.ep-acts{display:flex;align-items:center;gap:2px}
.mark{color:var(--muted)}
.mark.on{color:var(--good)}
.badge.new{background:var(--accent);color:var(--accent-ink)}
.badge.heard{background:var(--surface-2);color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip.caught{opacity:.5}
.chip.caught[aria-pressed="true"]{opacity:1}
.empty .btn{display:block}

/* Quiet shows (no new episode in a year) */
.badge.quiet{background:rgba(239,125,109,.16);color:var(--danger)}
.quiet-card{border:1px solid rgba(239,125,109,.45)}
.quiet-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.quiet-row:last-child{border-bottom:0}
.quiet-row img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.quiet-row .t{font-weight:600}
.quiet-row .a{font-size:14px;color:var(--muted)}
.quiet-row .btn-row{grid-column:1/-1}
.quiet-row .btn{padding:10px 16px;min-height:44px}
.btn.danger{background:var(--danger);color:#1f0906}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main class="scroller" id="scroller"><div class="view" id="view"></div></main>
</div>

<div class="bottom">
  <div class="mini" id="mini" hidden>
    <img id="miniArt" alt="">
    <button class="open" id="miniOpen" aria-label="Open player"><div class="t" id="miniTitle"></div><div class="s" id="miniShow"></div></button>
    <button class="icon-btn" id="miniBack" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg></button>
    <button class="play-btn" id="miniPlay" aria-label="Play"></button>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Shows</button>
    <button data-tab="suggest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg>Suggested</button>
    <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="8" cy="18" r="2" fill="var(--bg)"/></svg>Settings</button>
  </nav>
</div>

<section class="player" id="player" aria-label="Now playing" aria-hidden="true">
  <div class="grab">
    <button class="back" id="playerClose" style="background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0">Done</button>
    <button class="pill-btn" id="pipBtn" hidden>Picture in picture</button>
  </div>
  <div class="stage" id="stage">
    <img id="bigArt" alt="">
    <video id="video" playsinline webkit-playsinline preload="metadata" hidden></video>
    <audio id="audio" preload="metadata"></audio>
    <div class="tx-box" id="txBox" aria-label="Transcript"></div>
  </div>
  <div class="info"><div class="t" id="pTitle"></div><div class="s" id="pShow"></div><div class="trim-info" id="trimInfo" hidden></div></div>
  <div class="scrub">
    <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Position">
    <div class="times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
  </div>
  <div class="transport">
    <button class="skip" id="back15" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg><span id="backLbl">15</span></button>
    <button class="big-play" id="bigPlay" aria-label="Play"></button>
    <button class="skip" id="fwd30" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg><span id="fwdLbl">30</span></button>
  </div>
  <div class="extras">
    <label for="speedSel">Speed

/* A show can sit under several subjects (cats). Copies from before that kept one subject in cat,

  var out = [], add = function(c){ c = String(c||"").trim(); if(c && out.indexOf(c)<0) out.push(c); };
  if(Array.isArray(sh.cats)) sh.cats.forEach(add);

}
function normAll(subs){ Object.keys(subs||{}).forEach(function(id){ normCats(subs[id]); }); }

/* Played holds when it was marked: a positive time for played, a negative one for marked not played,

function fmt(t){

}
function fmtDur(sec){ if(!sec) return ""; var m=Math.round(sec/60); return m>=60? Math.floor(m/60)+" hr"+(m%60? " "+(m%60)+" min":"") : m+" min"; }

/* Episodes in a show's list not yet finished (partly played ones count). null until the list has loaded once. */

/* Apple's podcast directory, called with JSONP so no CORS setup or key is needed. */
var jn = 0;
function jsonp(url){
  return new Promise(function(res, rej){
    var cb = "__pp" + (++jn) + "_" + Date.now();
    var s = document.createElement("script");
    var timer = setTimeout(function(){ done(); rej(new Error("timeout")); }, 15000);
    function done(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); }
    window[cb] = function(data){ done(); res(data); };
    s.onerror = function(){ done(); rej(new Error("network")); };
    s.src = url + (url.indexOf("?")<0?"?":"&") + "callback=" + cb;
    document.head.appendChild(s);
  });
}
function appleSearch(term, limit){
  return jsonp("https://itunes.apple.com/search?media=podcast&entity=podcast&limit="+(limit||25)+"&term="+encodeURIComponent(term))
    .then(function(d){ return (d.results||[]).filter(function(r){return r.collectionId;}).map(appleShow); });

/* Podcast Index, with the key and secret Kevin saves on this device. */
function hasPI(){ return !!(S.pi && S.pi.key && S.pi.secret); }
function sha1(s){
  return crypto.subtle.digest("SHA-1", new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b), function(x){return x.toString(16).padStart(2,"0");}).join("");
  });
}
function pi(path, params){
  if(!hasPI()) return Promise.reject(new Error("nokey"));

  var qs = Object.keys(params||{}).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k]);}).join("&");
  return sha1(S.pi.key + S.pi.secret + date).then(function(h){
    return fetch("https://api.podcastindex.org/api/1.0/"+path+(qs?"?"+qs:""), {headers:{"X-Auth-Date":date, "X-Auth-Key":S.pi.key, "Authorization":h}});
  }).then(function(r){ if(r.status===401) throw new Error("badkey"); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}
function fromPIFeed(f){

}
function piSearch(term){ return pi("search/byterm", {q:term, max:30}).then(function(d){ return (d.feeds||[]).map(fromPIFeed); }); }

/* ---------- episodes ---------- */
var inflight = {};
function episodesFor(show, force){
  var c = S.cache[show.id];
  if(!force && c && c.eps && Date.now()-c.at < 30*60*1000) return Promise.resolve(c.eps);
  if(inflight[show.id]) return inflight[show.id];
  var p = (hasPI() ? fetchPIEps(show).catch(function(){ return fetchAppleOrRss(show); }) : fetchAppleOrRss(show)).then(function(eps){
    // Keep the same 100 episodes whether the list comes fresh or from the saved copy, so Recent and
    // New to me don't change length. The saved copy keeps shorter descriptions to save space.
    eps = eps.slice(0,100);
    noteNewest(show.id, newestOf(eps));
    S.cache[show.id] = {at:Date.now(), eps:eps.map(function(e){ var c = {}; for(var k in e) c[k] = e[k]; if(c.x && c.x.length > 700) c.x = c.x.slice(0,700)+"…"; return c; }), gs:eps.map(function(e){ return e.g; })}; save(); delete inflight[show.id]; return eps;
  }, function(err){ delete inflight[show.id]; if(c && c.eps) return c.eps; throw err; });
  inflight[show.id] = p; return p;
}
function fetchAppleOrRss(show){ return show.itunesId ? fetchAppleEps(show) : fetchRssEps(show); }
function fetchPIEps(show){
  var call = show.piId ? pi("episodes/byfeedid", {id:show.piId, max:100, fulltext:""})
           : show.itunesId ? pi("episodes/byitunesid", {id:show.itunesId, max:100, fulltext:""})
           : pi("episodes/byfeedurl", {url:show.feedUrl, max:100, fulltext:""});
  return call.then(function(d){
    var items = d.items||[]; if(!items.length) throw new Error("empty");
    if(!show.piId && items[0].feedId){ show.piId = items[0].feedId; }
    return items.filter(function(i){return i.enclosureUrl;}).map(function(i){
      var tr = (i.transcripts && i.transcripts.length) ? i.transcripts.map(function(t){return {url:t.url, type:t.type||""};}) : (i.transcriptUrl? [{url:i.transcriptUrl, type:""}] : []);
      return {g:String(i.guid||i.enclosureUrl).trim(), s:show.id, t:i.title||"Episode", d:i.datePublished? new Date(i.datePublished*1000).toISOString() : "",
        u:i.enclosureUrl, v:isVideo(i.enclosureType, i.enclosureUrl), ty:i.enclosureType||"", len:i.duration||0, x:plain(i.description||"").slice(0,1500),
        a:i.image||i.feedImage||"", ch:i.chaptersUrl||"", tr:tr};
    });
  });
}
function fetchAppleEps(show){
  return jsonp("https://itunes.apple.com/lookup?entity=podcastEpisode&limit=100&id="+show.itunesId).then(function(d){
    var rs = d.results||[];
    var head = rs.filter(function(r){return r.kind==="podcast";})[0];
    if(head){ if(!show.feedUrl && head.feedUrl) show.feedUrl = head.feedUrl; if(head.artworkUrl600 && !show.art) show.art = bigArt(head.artworkUrl600); }
    var eps = rs.filter(function(r){return r.wrapperType==="podcastEpisode" && r.episodeUrl;}).map(function(r){
      return {g:String(r.episodeGuid||r.episodeUrl).trim(), s:show.id, t:r.trackName||"Episode", d:r.releaseDate, u:r.episodeUrl,
        v:isVideo(r.episodeContentType, r.episodeUrl), ty:r.episodeContentType||"", len:r.trackTimeMillis? r.trackTimeMillis/1000 : 0,
        x:plain(r.description||r.shortDescription||"").slice(0,1500), a:bigArt(r.artworkUrl600||r.artworkUrl160||""), ch:"", tr:null};
    });
    eps.sort(function(a,b){return new Date(b.d)-new Date(a.d);});

    return eps;
  });
}
function fetchRssEps(show){
  if(!show.feedUrl) return Promise.reject(new Error("no feed"));
  return fetch(show.feedUrl, {mode:"cors"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); }).then(function(txt){
    var x = new DOMParser().parseFromString(txt, "application/xml");
    var ch = x.querySelector("channel");
    if(ch && !show.art){ var img = ch.querySelector("image > url"); var it = ch.getElementsByTagNameNS("*","image")[0]; show.art = (it && it.getAttribute("href")) || (img && img.textContent) || ""; }
    return rssItems(x, show.id);

}
function rssItems(x, sid){
  return Array.prototype.slice.call(x.querySelectorAll("item")).map(function(item){
    var enc = item.querySelector("enclosure"); if(!enc) return null;
    var u = enc.getAttribute("url"); var g = item.querySelector("guid");
    var durEl = item.getElementsByTagNameNS("*","duration")[0]; var dur = 0;
    if(durEl){ var p = durEl.textContent.trim().split(":").map(Number); dur = p.reduce(function(a,b){return a*60+b;},0)||0; }

    var tr = Array.prototype.map.call(item.getElementsByTagNameNS("*","transcript"), function(t){ return {url:t.getAttribute("url"), type:t.getAttribute("type")||""}; }).filter(function(t){return t.url;});
    var chEl = item.getElementsByTagNameNS("*","chapters")[0];
    return {g:String((g&&g.textContent.trim())||u).trim(), s:sid, t:title?title.textContent:"Episode", d:date?new Date(date.textContent).toISOString():"",
      u:u, v:isVideo(enc.getAttribute("type"), u), ty:enc.getAttribute("type")||"", len:dur, x:plain(desc?desc.textContent:"").slice(0,1500), a:"", ch: chEl? chEl.getAttribute("url")||"" : "", tr:tr};
  }).filter(Boolean);
}

/* ---------- navigation ---------- */
var route = {tab:"home"}; var arranging = false; var filterCat = "";
function go(r){ route = r; render(); $("scroller").scrollTop = 0; }

  var top = $("topbar"), view = $("view"); top.innerHTML = ""; view.innerHTML = "";

  if(route.show) return renderShow(top, view, route.show);
  if(route.quiet) return renderQuiet(top, view);

/* ---------- Home ---------- */
function renderHome(top, view){
  top.appendChild(el("h1",{text:"Shows"}));
  if(S.fav.length>1 || arranging) top.appendChild(el("button",{class:"pill-btn"+(arranging?" on":""), text:arranging?"Done":"Arrange", onclick:function(){arranging=!arranging; if(arranging) filterCat=""; render();}}));

  var subs = subjects();
  if(filterCat && subs.indexOf(filterCat)<0 && filterCat!=="-") filterCat = "";
  var memberOf = function(sh, c){ var cs = catsOf(sh); return c==="-" ? !cs.length : cs.indexOf(c)>=0; };
  // In a subject, only shows with something left to hear, unless asked to show them all.
  // A show whose episode list hasn't loaded yet stays until it's checked.
  var leftToHear = function(sh){ var u = unheard(sh); return u===null || u.length>0; };
  var inCat = function(sh){ return !filterCat || (memberOf(sh, filterCat) && (showCaughtUp || leftToHear(sh))); };

    var chips = el("div",{class:"chips", role:"group", "aria-label":"Filter by subject"});
    var mk = function(label, val){
      var members = val ? Object.keys(S.subs).map(function(id){ return S.subs[id]; }).filter(function(sh){ return memberOf(sh, val); }) : [];
      var done = val && members.length && members.every(function(sh){ var u = unheard(sh); return u!==null && !u.length; });

    };

    view.appendChild(chips);
  }
  if(!arranging){ var qb = quietBanner(); if(qb) view.appendChild(qb); }
  if(filterCat && !arranging) checkCat(filterCat, memberOf);
  var hiddenN = filterCat ? Object.keys(S.subs).filter(function(id){ var sh = S.subs[id]; return memberOf(sh, filterCat) && !leftToHear(sh); }).length : 0;
  var catName = filterCat==="-" ? "No subject" : filterCat;
  if(filterCat && !arranging && !showCaughtUp && hiddenN && hiddenN===Object.keys(S.subs).filter(function(id){ return memberOf(S.subs[id], filterCat); }).length){
    view.appendChild(el("div",{class:"empty"},[
      el("p",{style:"margin:0 0 12px", text:"All caught up in "+catName+". Every episode of its "+hiddenN+" show"+(hiddenN===1?"":"s")+" has been played."}),
      el("button",{class:"btn secondary", style:"align-self:center;margin:0 auto", text:"Show them anyway", onclick:function(){ showCaughtUp = true; render(); }})
    ]));

  if(!S.fav.length){
    favSec.appendChild(el("p",{class:"empty", text:"Tap the star on any show to add it here. Favorites stay in the order you set with Arrange."}));
  } else if(!favIds.length){
    favSec.appendChild(el("p",{class:"note", text: filterCat && !showCaughtUp ? "No favorites with something left to hear here." : "No favorites in this subject."}));
  } else {
    var ul = el("ul",{class:"fav-list", id:"favList"});
    favIds.forEach(function(id){ ul.appendChild(favRow(S.subs[id], S.fav.indexOf(id))); });
    favSec.appendChild(ul);
    if(arranging) favSec.appendChild(el("p",{class:"note", style:"margin-top:10px", text:"Drag the grip, or use the arrows. Your order saves as you go."}));

    if(s.feedUrl) k["u:"+normUrl(s.feedUrl)] = 1; k["t:"+String(s.title||"").toLowerCase().trim()] = 1; });

}
function keysOf(sh){
  return [sh.id, sh.itunesId&&"it:"+sh.itunesId, sh.piId&&"pi:"+sh.piId, sh.feedUrl&&"u:"+normUrl(sh.feedUrl), "t:"+String(sh.title||"").toLowerCase().trim()].filter(Boolean);

    return dbxJson(r).then(function(j){ if(!r.ok) throw new Error(dbxErr(j, r.status)); return j; });
  });
}
function dbxDownload(){
  return dbxCall("https://content.dropboxapi.com/2/files/download", {"Dropbox-API-Arg":JSON.stringify({path:DBX_FILE})}).then(function(r){
    if(r.status===409) return dbxJson(r).then(function(j){ if(/not_found/.test(j.error_summary||"")) return null; throw new Error(dbxErr(j, 409)); });
    if(!r.ok) return dbxJson(r).then(function(j){ throw new Error(dbxErr(j, r.status)); });
    var meta = {}; try{ meta = JSON.parse(r.headers.get("Dropbox-API-Result")||"{}"); }catch(e){}
    return r.text().then(function(t){
      var d = null; try{ d = JSON.parse(t); }catch(e){}
      if(meta.rev) return {rev:meta.rev, data:d};
      return dbxApi("files/get_metadata", {path:DBX_FILE}).then(function(m){ return {rev:m.rev, data:d}; });
    });
  });
}
function dbxUpload(data, rev, keepalive){
  var body = JSON.stringify(data);
  var arg = {path:DBX_FILE, mode: rev ? {".tag":"update", update:rev} : {".tag":"add"}, autorename:false, mute:true, strict_conflict:true};
  return dbxCall("https://content.dropboxapi.com/2/files/upload", {"Dropbox-API-Arg":JSON.stringify(arg), "Content-Type":"application/octet-stream"}, body, keepalive && body.length < 60000).then(function(r){
    return dbxJson(r).then(function(j){
      if(r.status===409 && /conflict/.test(j.error_summary||"")){ var e = new Error("conflict"); e.conflict = true; throw e; }
      if(!r.ok) throw new Error(dbxErr(j, r.status));
      return j.rev;
    });
  });
}

/* What travels between devices. Anything not listed here stays on the device. */
function snap(){
  return {subs:S.subs, fav:S.fav, pos:S.pos, posT:S.posT, played:S.played, hideSugg:S.hideSugg, unf:S.unf, keep:S.keep, now:S.now, nowT:S.nowT||0,
    prefs:{speed:S.speed, skipBack:S.skipBack, skipFwd:S.skipFwd, adSkip:S.adSkip, epSort:S.epSort, trim:S.trim, trimMin:S.trimMin}};
}
function copy(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
function stable(v){
  if(v===undefined) return "u";
  if(v===null || typeof v!=="object") return JSON.stringify(v);
  if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
  return "{"+Object.keys(v).sort().filter(function(k){ return v[k]!==undefined; }).map(function(k){ return JSON.stringify(k)+":"+stable(v[k]); }).join(",")+"}";
}
function same(a, b){ return stable(a)===stable(b); }
/* Three-way pick: whichever side changed since the last synced copy wins; if both did, `mine` decides. */
function pick3(b, l, r, preferLocal){
  var lc = !same(l, b), rc = !same(r, b);
  return !lc ? r : !rc ? l : (preferLocal ? l : r);
}
function mergeFields(b, l, r, preferLocal){
  var out = {}, keys = {};
  [b||{}, l, r].forEach(function(o){ Object.keys(o).forEach(function(k){ keys[k] = 1; }); });
  Object.keys(keys).forEach(function(k){ var v = pick3((b||{})[k], l[k], r[k], preferLocal); if(v!==undefined) out[k] = copy(v); });
  return out;
}
/* base: the copy last seen on Dropbox (null on a device's first sync). local: this device. remote: Dropbox now.
   On a first sync Dropbox's copy wins ties, so a new device takes on the order and settings already set up. */
function mergeSync(base, local, remote, fresh){
  var B = base || {subs:{}, fav:[], pos:{}, posT:{}, played:{}, hideSugg:{}, unf:{}, keep:{}, prefs:{}};
  var preferLocal = !!base;
  var L = copy(local), R = copy(remote);
  ["subs","pos","posT","played","hideSugg","unf","keep","prefs"].forEach(function(k){ B[k] = B[k]||{}; L[k] = L[k]||{}; R[k] = R[k]||{}; });
  B.fav = B.fav||[]; L.fav = L.fav||[]; R.fav = R.fav||[];
  if(fresh){ L.subs = {}; L.fav = []; }
  var out = {subs:{}, pos:{}, posT:{}, played:{}, hideSugg:{}, unf:{}, keep:{}, prefs:{}};

  // Shows: added on either side stay; removed on either side go, unless the other side added it fresh.
  var ids = {}; [B.subs, L.subs, R.subs].forEach(function(o){ Object.keys(o).forEach(function(id){ ids[id] = 1; }); });
  Object.keys(ids).forEach(function(id){
    var b = B.subs[id], l = L.subs[id], r = R.subs[id];
    if(!b){ out.subs[id] = (l && r) ? mergeFields(null, l, r, preferLocal) : copy(l||r); return; }
    if(!l || !r) return;
    out.subs[id] = mergeFields(b, l, r, preferLocal);
  });
  // Unfollow notes and Keep choices: the newest time for each show wins. A show stays unfollowed
  // unless it was followed again after the note.
  ["unf","keep"].forEach(function(k){ [L[k], R[k]].forEach(function(o){ Object.keys(o).forEach(function(id){ var t = +o[id]||0; if(t > (out[k][id]||0)) out[k][id] = t; }); }); });
  Object.keys(out.unf).forEach(function(id){ var sh = out.subs[id]; if(sh && out.unf[id] > (+sh.fT||0)) delete out.subs[id]; });

  // Favorites order.
  var lc = !same(L.fav, B.fav), rc = !same(R.fav, B.fav);
  var order = !lc ? R.fav : !rc ? L.fav : (preferLocal ? L.fav.concat(R.fav) : R.fav.concat(L.fav));
  var dropped = {};
  B.fav.forEach(function(id){ if((lc && L.fav.indexOf(id)<0) || (rc && R.fav.indexOf(id)<0)) dropped[id] = 1; });
  var seen = {};
  out.fav = order.filter(function(id){ if(seen[id] || dropped[id] || !out.subs[id]) return false; seen[id] = 1; return true; });

  // Listening spots: the newer one wins for each episode, including a spot cleared because it finished.
  var eps = {}; [L.posT, R.posT, L.pos, R.pos].forEach(function(o){ Object.keys(o).forEach(function(g){ eps[g.replace(/#len$/,"")] = 1; }); });
  Object.keys(eps).forEach(function(g){
    var lt = L.posT[g]||0, rt = R.posT[g]||0, src = rt > lt ? R : L;
    if(rt===lt && L.pos[g]==null) src = R;
    if(src.pos[g]!=null) out.pos[g] = src.pos[g];
    if(Math.max(lt, rt)) out.posT[g] = Math.max(lt, rt);
    var len = Math.max(L.pos[g+"#len"]||0, R.pos[g+"#len"]||0); if(len) out.pos[g+"#len"] = len;
  });
  // Played or marked not played: whichever happened last wins (a negative time means not played).
  [L.played, R.played].forEach(function(o){ Object.keys(o).forEach(function(g){ var t = o[g]===true ? 1 : +o[g]||1; if(out.played[g]==null || Math.abs(t) > Math.abs(out.played[g])) out.played[g] = t; }); });
  [L.hideSugg, R.hideSugg].forEach(function(o){ Object.keys(o).forEach(function(id){ out.hideSugg[id] = 1; }); });

  ["speed","skipBack","skipFwd","adSkip","epSort","trim","trimMin"].forEach(function(k){ var v = pick3(B.prefs[k], L.prefs[k], R.prefs[k], preferLocal); if(v!==undefined) out.prefs[k] = v; });

  var rn = R.nowT||0, ln = L.nowT||0;
  if(rn > ln || (!L.now && R.now)){ out.now = R.now||null; out.nowT = rn; } else { out.now = L.now||null; out.nowT = ln; }
  return out;
}
function isFresh(){
  var ids = Object.keys(S.subs);
  return !lsGet(DBX_BASE) && ids.length===1 && ids[0]===NEWSLINE.id && S.fav.length<=1 && !Object.keys(S.pos).length;
}
function applyMerged(m){
  var before = stable({subs:S.subs, fav:S.fav, played:S.played, hide:S.hideSugg, keep:S.keep});
  var lt = cur ? (S.posT[cur.g]||0) : 0;
  var prefsBefore = stable(snap().prefs);
  S.subs = m.subs; S.fav = m.fav; S.pos = m.pos; S.posT = m.posT; S.played = m.played; S.hideSugg = m.hideSugg; S.unf = m.unf||{}; S.keep = m.keep||{};
  normAll(S.subs);
  ["speed","skipBack","skipFwd","adSkip","epSort","trim","trimMin"].forEach(function(k){ if(m.prefs[k]!==undefined) S[k] = m.prefs[k]; });
  // The episode last played anywhere becomes the one loaded here, unless this device is playing right now.
  var idle = !cur || media.paused;
  if(idle && m.now && m.now.u && (m.nowT > (S.nowT||0) || !S.now)){
    S.nowT = m.nowT;
    if(!cur || cur.g!==m.now.g){ S.now = m.now; playEp(m.now, false); }
  }
  // Move to a spot reached on another device: when paused here, or when play only just started
  // here and the other device's spot is newer than anything this device had.
  var newer = cur && (S.posT[cur.g]||0) > lt;
  var dd = dur();
  if(cur && S.pos[cur.g]!=null && media.readyState>=1 && (!dd || S.pos[cur.g] < dd-10) && Math.abs((media.currentTime||0) - S.pos[cur.g]) > 3 && (idle || (hold.on && !hold.user && newer))){
    wantAt = S.pos[cur.g]; progSeek = true; try{ media.currentTime = S.pos[cur.g]; }catch(e){ progSeek = false; }
    if(!idle) toast("Picked up where you left off on another device");
  }
  save(true, true);
  if(stable(snap().prefs)!==prefsBefore){ applySkipLabels(); $("speedSel").value = String(S.speed||1); if(cur) media.playbackRate = S.speed||1; }
  var changed = stable({subs:S.subs, fav:S.fav, played:S.played, hide:S.hideSugg, keep:S.keep})!==before;
  if(changed && route.tab!=="settings" && !arranging) render();
}
function setSync(msg, err){
  sync.msg = msg; sync.err = !!err;
  var n = $("syncStatus"); if(n){ n.textContent = msg; n.className = "status"+(err?" err":""); }
}
function syncedLabel(){
  if(!sync.at) return "";
  var d = new Date(sync.at), today = d.toDateString()===new Date().toDateString();
  return "Last synced "+(today? "" : fmtDate(d.toISOString())+", ")+d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})+".";
}
function runSync(tries, keepalive){
  return dbxDownload().then(function(remote){
    var baseRec = lsGet(DBX_BASE), base = baseRec && baseRec.data;
    var rd = remote && remote.data && remote.data.app==="podcast-player" ? remote.data : null;
    var local = copy(snap());
    var merged = rd ? mergeSync(base, local, rd, !base && isFresh()) : local;
    applyMerged(merged);
    var out = copy(snap());
    if(rd && same(out, pickSnap(rd))){ lsSet(DBX_BASE, {data:out}); return; }
    var file = copy(out); file.app = "podcast-player"; file.v = 1; file.at = new Date().toISOString();
    return dbxUpload(file, remote && remote.rev, keepalive).then(function(){ lsSet(DBX_BASE, {data:out}); }, function(e){
      if(e.conflict && tries < 3) return runSync(tries+1, false);
      throw e;
    });
  });
}
function pickSnap(d){ var o = {}; Object.keys(snap()).forEach(function(k){ o[k] = d[k]; }); return o; }
function syncNow(keepalive){
  if(!dbx || !dbxKey()) return Promise.resolve();
  if(sync.busy){ sync.again = true; return sync.busy; }
  clearTimeout(sync.timer);
  if(navigator.onLine===false){ setSync("Offline. Changes will sync when you're back online."); return Promise.resolve(); }
  setSync("Syncing…");
  sync.busy = runSync(0, keepalive).then(function(){
    sync.at = Date.now(); sync.sent = stable(snap()); sync.syncedKey = keyState(); sync.warned = false; setSync(syncedLabel());
  }, function(e){
    if(!dbx) return;
    if(e && e.message==="signedout") return;
    var said = errText(e), when = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    if(/missing_scope|required scope/i.test(said)) setSync("Couldn't save to Dropbox at "+when+": the Dropbox app doesn't have permission to read and write its files. On the app's Permissions tab in the Dropbox App Console, tick files.content.read and files.content.write and click Submit. Then sign out here and sign in again. Dropbox said: "+said, true);
    else setSync("Couldn't save to Dropbox at "+when+". Dropbox said: "+said+". Will try again.", true);
    if(!sync.warned){ sync.warned = true; toast("Dropbox sync isn't working. Settings shows why."); }
  }).then(function(){ sync.busy = null; holdEnd(); if(sync.again){ sync.again = false; syncSoon(800); } });
  return sync.busy;
}
/* When play starts and Dropbox hasn't been checked in the last little while, hold off on
   recording this device's spot until the check is done, so a newer spot from another device wins. */
function holdStart(){
  if(!dbx || !dbxKey() || navigator.onLine===false || (sync.at && Date.now()-sync.at < 20000)) return;
  hold.on = true; hold.user = false; clearTimeout(hold.timer); hold.timer = setTimeout(holdEnd, 15000);
  syncNow();
}
function holdEnd(){ if(!hold.on) return; hold.on = false; clearTimeout(hold.timer); }
function syncSoon(ms){ if(!dbx) return; clearTimeout(sync.timer); sync.timer = setTimeout(function(){ syncNow(); }, ms); }
/* Shows, favorites and settings sync a few seconds after a change. Listening spots ride along,
   and on their own go out every two minutes while playing, on pause, and when the app goes to the background. */
function keyState(){ var s = snap(); return stable({subs:s.subs, fav:s.fav, played:s.played, hideSugg:s.hideSugg, unf:s.unf, keep:s.keep, prefs:s.prefs}); }
function syncCheck(){
  if(!dbx || sync.busy) return;
  if(keyState()!==sync.syncedKey) syncSoon(3000);
  else if(stable(snap())!==sync.sent && Date.now()-sync.at > 120000) syncSoon(1000);
}
setInterval(syncCheck, 30000);
window.addEventListener("online", function(){ syncSoon(500); });
document.addEventListener("visibilitychange", function(){ if(!dbx) return; if(document.visibilityState==="visible") syncSoon(300); else syncNow(true); });

/* Coming back from Dropbox's sign-in page. */
function dbxReturn(){
  var p = new URLSearchParams(location.search);
  if(!p.has("code") && !p.has("error")) return;
  try{ history.replaceState(null, "", dbxRedirect()); }catch(e){}
  route = {tab:"settings"};
  if(p.get("error")){ setSync(p.get("error")==="access_denied" ? "Dropbox sign-in was canceled." : "Dropbox sign-in didn't finish. Dropbox said: "+p.get("error")+(p.get("error_description")? " ("+p.get("error_description")+")" : "")+". Try again.", p.get("error")!=="access_denied"); return; }
  var pend = lsGet(DBX_PEND), code = p.get("code");
  if(!pend || pend.s!==p.get("state")){ sync.orphan = code; return; }
  setSync("Finishing sign-in…");
  dbxExchange(code, pend, true).then(gotTokens).then(function(){ if(route.tab==="settings" && !route.show) render(); }, function(e){
    setSync("Dropbox sign-in didn't finish. Dropbox said: "+errText(e)+". Try again.", true); if(route.tab==="settings") render();
  });
}
function syncCard(){
  var card = el("div",{class:"card", id:"syncCard"},[ el("h3",{text:"Sync with Dropbox"}) ]);
  var status = el("p",{class:"status"+(sync.err?" err":""), id:"syncStatus", "aria-live":"polite", text:sync.msg});
  if(!dbxKey()){
    card.appendChild(el("p",{text:"Dropbox sync isn't switched on for this copy of the app yet. Until it is, use Save backup and Restore backup below to move between devices."}));
    return card;
  }
  if(dbx){
    card.appendChild(el("p",{text:"Signed in"+(dbx.name? " as "+dbx.name : "")+(dbx.email? " ("+dbx.email+")" : "")+". Shows, subjects, favorites order, listening spots and playback settings stay the same on every device signed in to this Dropbox. Your Podcast Index key stays on each device."}));
    if(!sync.msg && sync.at) status.textContent = syncedLabel();
    card.appendChild(status);
    card.appendChild(el("div",{class:"btn-row"},[
      el("button",{class:"btn secondary", text:"Sync now", onclick:function(){ syncNow(); }}),
      el("button",{class:"btn secondary", text:"Sign out of Dropbox", onclick:function(){ dbxSignOut(); toast("Signed out of Dropbox. Your shows stay on this device."); render(); }})
    ]));
    return card;
  }
  card.appendChild(el("p",{text:"Sign in with your own Dropbox to keep your shows, subjects, favorites order and listening spots the same on your iPhone, iPad and computer. The app can only see its own folder in your Dropbox, Apps, then the app's name. Do this once on each device, inside the app you added to your Home Screen."}));
  var codeInp = el("input",{id:"dbxCode", type:"text", autocomplete:"off", autocapitalize:"off", spellcheck:"false", placeholder:"Paste the code from Dropbox", value:sync.orphan||""});
  var connect = el("button",{class:"btn", text:"Finish sign-in", onclick:function(){
    setSync("Finishing sign-in…");
    dbxUseCode(codeInp.value).then(function(){ render(); }, function(e){
      setSync(e.message==="empty" ? "Paste the code Dropbox showed you first." : "Dropbox didn't accept that code ("+errText(e)+"). Codes work once and expire after a few minutes, so get a new one and try again.", true);
    });
  }});
  var codeBox = el("div",{class:"form-grid"},[ el("label",{class:"field", for:"dbxCode"},[ "Code from Dropbox", codeInp ]) ]);
  var openLink = el("a",{class:"btn", href:"#", target:"_blank", rel:"noopener", style:"text-decoration:none;display:inline-flex;align-items:center", text:"Get a sign-in code from Dropbox"});
  var signBtn = el("button",{class:"btn", text:"Sign in with Dropbox", disabled:true});
  var codeLink = el("button",{class:"btn secondary", text:"Use a sign-in code instead"});
  var codeArea = el("div",{style:"display:flex;flex-direction:column;gap:10px"},[
    el("ol",{class:"steps"},[ el("li",{text:"Tap Get a sign-in code and allow access in Dropbox."}), el("li",{text:"Copy the code Dropbox shows, come back here, and paste it below."}) ]),
    el("div",{class:"btn-row"},[ openLink ]), codeBox, el("div",{class:"btn-row"},[ connect ])
  ]);
  dbxPending().then(function(p){
    openLink.href = dbxAuthUrl(p, false);
    signBtn.disabled = false; signBtn.onclick = function(){ location.assign(dbxAuthUrl(p, true)); };
  });
  if(sync.orphan){
    card.appendChild(el("p",{text:"Dropbox sent you back here with a code. If you started sign-in from the Home Screen app, copy this code and paste it there. Otherwise tap Finish sign-in."}));
    card.appendChild(codeBox); card.appendChild(el("div",{class:"btn-row"},[ connect, el("button",{class:"btn secondary", text:"Copy code", onclick:function(){ try{ navigator.clipboard.writeText(sync.orphan).then(function(){ toast("Code copied"); }); }catch(e){} }}) ]));
  } else if(codeFlow()){
    card.appendChild(codeArea);
  } else {
    codeArea.hidden = true;
    codeLink.onclick = function(){ codeArea.hidden = false; codeLink.hidden = true; };
    card.appendChild(el("div",{class:"btn-row"},[ signBtn, codeLink ]));
    card.appendChild(codeArea);
  }
  card.appendChild(status);
  return card;
}

/* ---------- start ---------- */
dbxReturn();
applySkipLabels();
if(S.now && S.now.u){ playEp(S.now, false); }
render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(function(){});
if(dbx) syncNow();
setTimeout(function(){ if(Date.now()-(S.quietAt||0) > QUIET_RESCAN) quietScan(); }, 6000);
window.__pp = {S:S, quietScan:quietScan, isQuiet:isQuiet, episodesFor:episodesFor, appleSearch:appleSearch, parseTranscript:parseTranscript, matchFeed:matchFeed, mergeSync:mergeSync, stable:stable, pkceChallenge:pkceChallenge, syncNow:syncNow, dbxAuthUrl:dbxAuthUrl, dbxPending:dbxPending};

var AL={on:/align/.test(location.search), lv:[]};
if(AL.on){ audio.crossOrigin="anonymous"; audio.addEventListener("play", function(){ if(AL.ctx) return; AL.ctx=new AudioContext(); var src=AL.ctx.createMediaElementSource(audio); AL.an=AL.ctx.createAnalyser(); AL.an.fftSize=1024; src.connect(AL.an); AL.an.connect(AL.ctx.destination); var buf=new Float32Array(1024);
  setInterval(function(){ if(audio.paused) return; AL.an.getFloatTimeDomainData(buf); var s=0; for(var i=0;i<buf.length;i++) s+=buf[i]*buf[i]; AL.lv.push([audio.currentTime, 10*Math.log10(s/buf.length+1e-12)]); if(AL.lv.length>20000) AL.lv.shift(); }, 20); }); }
function alignReport(){ if(!TR||!AL.lv.length) return ""; var inq=[], on=[], out=[];
  AL.lv.forEach(function(p){ var t=p[0], r=TR.runs.filter(function(r){return t>=r.s+0.08&&t<=r.e-0.08;})[0]; if(r) inq.push(p[1]); else if(TR.runs.some(function(r){return t>r.e+0.03&&t<r.e+0.25;})) on.push(p[1]); else out.push(p[1]); });
  function avg(a){ return a.length? (a.reduce(function(x,y){return x+y;},0)/a.length).toFixed(1) : "-"; } function q(a){ return a.length? Math.round(100*a.filter(function(x){return x<-45;}).length/a.length)+"%" : "-"; }
  return "\nALIGN in-run n="+inq.length+" avg="+avg(inq)+" quiet="+q(inq)+" | onset n="+on.length+" avg="+avg(on)+" quiet="+q(on)+" | other n="+out.length+" avg="+avg(out)+" quiet="+q(out)+" | jumps="+JSON.stringify((window.jumps||[]).slice(-5)); }
setInterval(function(){ var T=TR, d=document.getElementById("dbg"); if(!d) return; var b=media.buffered, bs=[]; for(var i=0;i<b.length;i++) bs.push(b.start(i).toFixed(0)+"-"+b.end(i).toFixed(0));
d.textContent = !T ? "TR none; S.trim="+S.trim : "st="+T.st+" why="+(T.why||"")+" t="+(media.currentTime||0).toFixed(2)+" md="+(media.duration||0).toFixed(1)+" fd="+(T.fileDur||0).toFixed(1)+" br="+(T.h&&T.h.br)+" runs="+T.runs.length+" long="+T.runs.filter(function(r){return r.e-r.s>=(S.trimMin||1);}).length+" cov="+JSON.stringify(T.cov.map(function(c){return [+c[0].toFixed(1),+c[1].toFixed(1)];}))+" saved="+T.saved.toFixed(2)+" buf="+bs.join(",")+" url="+(T.url||"").slice(0,60)+"\nnext runs: "+T.runs.filter(function(r){return r.e>(media.currentTime||0);}).slice(0,6).map(function(r){return r.s.toFixed(2)+"-"+r.e.toFixed(2);}).join(" ")+alignReport()+" rate="+media.playbackRate+" wall="+Math.round(performance.now()/1000); },500);
var _st=trimTick; trimTick=function(t){ var before=TR&&TR.saved; _st(t); if(TR && TR.saved!==before) (window.jumps=window.jumps||[]).push([t.toFixed(2), media.currentTime.toFixed(2)]); };
})();
</script>
