<title>Probe</title><pre id="o">running…</pre>
<script>
var out = [];
function show(){ document.getElementById("o").textContent = out.join("\n\n"); }
function t(name, url, opts){
  return fetch(url, opts).then(function(r){ return r.text().then(function(b){ out.push(name+": "+r.status+" "+b.slice(0,300)); show(); }); }, function(e){ out.push(name+": THREW "+e); show(); });
}

  await t("rpc account null", "https://api.dropboxapi.com/2/users/get_current_account", {method:"POST", headers:{Authorization:A, "Content-Type":"application/json"}, body:"null"});
  await t("token refresh bogus", "https://api.dropboxapi.com/oauth2/token", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"grant_type=refresh_token&refresh_token=bogus&client_id=9yk2nzxp65t5krk"});
  out.push("DONE"); show();
})();
</script>
