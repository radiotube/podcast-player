<!doctype html><meta charset="utf-8"><title>Probe</title><pre id="o">running…</pre>
<script>
var out=[]; function show(){ document.getElementById("o").textContent = out.join("\n\n"); }
function t(name, url, opts){ return fetch(url, opts).then(function(r){ return r.text().then(function(b){ out.push(name+": "+r.status+" "+b.slice(0,250)); show(); }); }, function(e){ out.push(name+": THREW "+e); show(); }); }
var q = function(o){ return Object.keys(o).map(function(k){ return k+"="+encodeURIComponent(o[k]); }).join("&"); };
var arg = JSON.stringify({path:"/sync.json"});
var up = JSON.stringify({path:"/sync.json", mode:{".tag":"add"}, autorename:false, mute:true, strict_conflict:true});
(async function(){
  await t("download url-auth", "https://content.dropboxapi.com/2/files/download?"+q({authorization:"Bearer sl.fake", arg:arg}), {method:"POST"});
  await t("upload url-auth", "https://content.dropboxapi.com/2/files/upload?"+q({authorization:"Bearer sl.fake", arg:up}), {method:"POST", headers:{"Content-Type":"text/plain; charset=dropbox-cors-hack"}, body:"{}"});
  await t("rpc url-auth", "https://api.dropboxapi.com/2/files/get_metadata?"+q({authorization:"Bearer sl.fake"}), {method:"POST", headers:{"Content-Type":"text/plain; charset=dropbox-cors-hack"}, body:arg});
  out.push("DONE"); show();
})();
</script>
