function jsonp(url){ return new Promise(function(res,rej){ var cb="__p"+(++jn); var s=document.createElement("script"); var tm=setTimeout(function(){rej(new Error("timeout"));},20000); window[cb]=function(d){clearTimeout(tm);res(d);}; s.onerror=function(){rej(new Error("net"));}; s.src=url+"&callback="+cb; document.head.appendChild(s); }); }

function hdr(b,i){ if(b[i]!==0xFF||(b[i+1]&0xE0)!==0xE0) return null; var ver=(b[i+1]>>3)&3, lay=(b[i+1]>>1)&3; if(ver===1||lay!==1) return null; var bi=b[i+2]>>4, si=(b[i+2]>>2)&3, pad=(b[i+2]>>1)&1; if(bi===0||bi===15||si===3) return null; var br=(ver===3?BR1:BR2)[bi], sr=SR[ver][si]; var len=Math.floor((ver===3?144:72)*br*1000/sr)+pad; return {len:len, spf:ver===3?1152:576, sr:sr, br:br, ch:((b[i+3]>>6)===3)?1:2}; }
function frames(b){ var i=0; if(b[0]===0x49&&b[1]===0x44&&b[2]===0x33){ i=10+((b[6]&127)<<21|(b[7]&127)<<14|(b[8]&127)<<7|(b[9]&127)); }

function decode(b){ var f=frames(b); if(!f.list.length) return Promise.resolve({err:"no mp3 frames"}); var last=f.list[f.list.length-1]; var chunk=b.slice(f.list[0], last);

var rows=[], T=document.getElementById("t");
function row(a){ var tr=document.createElement("tr"); a.forEach(function(x){ var td=document.createElement("td"); td.innerHTML=x; tr.appendChild(td); }); T.appendChild(tr); }

            delete a.b; delete p.b; delete pf.b; res.push(rec);

  }).catch(function(e){ row([String(id),"","","lookup "+e]); });
}
(function seq(i){ if(i>=IDS.length){ var ok=res.filter(function(r){return r.range.ok||r.plain.ok;}).length; document.getElementById("sum").textContent="DONE "+ok+"/"+res.length+" readable"; document.getElementById("raw").textContent=JSON.stringify(res.map(function(r){return {t:r.t,g:r.g,u:r.u,range:r.range.ok,plain:r.plain.ok,pre:r.pre.ok,url:r.range.url||r.plain.url||"",err:r.range.err||""};})); return; } document.getElementById("sum").textContent="running "+(i+1)+"/"+IDS.length; one(IDS[i]).then(function(){ seq(i+1); }); })(0);
