var MP3_BR1 = [0,32,40,48,56,64,80,96,112,128,160,192,224,256,320], MP3_BR2 = [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
function mp3Hdr(b, i){
  if(i+4 > b.length || b[i]!==0xFF || (b[i+1]&0xE0)!==0xE0) return null;
  var ver = (b[i+1]>>3)&3, lay = (b[i+1]>>1)&3; if(ver===1 || lay!==1) return null;
  var bi = b[i+2]>>4, si = (b[i+2]>>2)&3, pad = (b[i+2]>>1)&1; if(bi===0 || bi===15 || si===3) return null;
  var br = (ver===3?MP3_BR1:MP3_BR2)[bi], sr = MP3_SR[ver][si];
  return {len:Math.floor((ver===3?144:72)*br*1000/sr)+pad, spf:ver===3?1152:576, sr:sr, br:br, ver:ver, mono:(b[i+3]>>6)===3};
}
function mp3Frames(b, from){
  var i = from||0, out = [];
  for(; i+4 < b.length; i++){
    var h = mp3Hdr(b,i); if(!h) continue;
    var h2 = mp3Hdr(b, i+h.len); if(!h2 && i+h.len+4 <= b.length) continue;
    if(h2){ var h3 = mp3Hdr(b, i+h.len+h2.len); if(!h3 && i+h.len+h2.len+4 <= b.length) continue; }
    break;
  }
  while(i+4 <= b.length){ var f = mp3Hdr(b,i); if(!f || i+f.len > b.length) break; out.push(i); i += f.len; }
  return out;
}
var MP3_SR = {3:[44100,48000,32000], 2:[22050,24000,16000], 0:[11025,12000,8000]};
function isInfo(b,i,h){for(var k=i+4;k<Math.min(i+h.len-4,i+60);k++){var s=String.fromCharCode(b[k],b[k+1],b[k+2],b[k+3]);if(s==="Xing"||s==="Info"||s==="VBRI")return true;}return false;}
(async function(){

 }
