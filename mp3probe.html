<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP3 probe</title>
<style>body{background:#11181b;color:#e9eef0;font:14px/1.4 monospace;padding:16px}pre{white-space:pre-wrap;word-break:break-all}</style></head>
<body><pre id="out">probing…</pre>
<script>
var U = "https://static1.squarespace.com/static/58b08985be65947bf171e05e/t/6ada55c44aa7f736f78e0fcb/1792693708439/Report2556.mp3";
var out = document.getElementById("out"), lines = [];
function log(s){ lines.push(s); out.textContent = lines.join("\n"); }
function hex(b, n){ var s=[]; for(var i=0;i<Math.min(n,b.length);i++) s.push(("0"+b[i].toString(16)).slice(-2)); return s.join(" "); }
fetch(U).then(function(r){
  log("status " + r.status);
  ["content-range","content-length","content-type","accept-ranges"].forEach(function(h){ log(h+": "+r.headers.get(h)); });
  return r.arrayBuffer();
}).then(function(ab){
  var b = new Uint8Array(ab); log("bytes " + b.length);
  log("head: " + hex(b, 16));
  var off = 0;
  if(b[0]===0x49&&b[1]===0x44&&b[2]===0x33){ off = 10 + ((b[6]&127)<<21|(b[7]&127)<<14|(b[8]&127)<<7|(b[9]&127)); if(b[5]&16) off += 10; log("ID3v2." + b[3] + " size to audio " + off); }
  var frames = 0, first = -1, info = [];
  for(var i=off;i<b.length-4 && frames<12;i++){
    if(b[i]===0xFF && (b[i+1]&0xE0)===0xE0){
      var ver=(b[i+1]>>3)&3, lay=(b[i+1]>>1)&3, br=(b[i+2]>>4)&15, sr=(b[i+2]>>2)&3, pad=(b[i+2]>>1)&1, ch=(b[i+3]>>6)&3;
      if(lay!==1 || br===0 || br===15 || sr===3 || ver===1) continue;
      var v1 = ver===3, brs = v1 ? [0,32,40,48,56,64,80,96,112,128,160,192,224,256,320] : [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
      var srs = {3:[44100,48000,32000],2:[22050,24000,16000],0:[11025,12000,8000]}[ver];
      var kbps = brs[br], hz = srs[sr], len = Math.floor((v1?144:72)*kbps*1000/hz)+pad;
      if(first<0){ first=i; }
      info.push("@"+i+" v"+(ver===3?"1":ver===2?"2":"2.5")+" L3 "+kbps+"kbps "+hz+"Hz ch"+ch+" len"+len);
      var side = v1 ? (ch===3?17:32) : (ch===3?9:17), tag = String.fromCharCode(b[i+4+side],b[i+5+side],b[i+6+side],b[i+7+side]);
      if(frames===0){ log("first frame tag at side offset: '" + tag + "'"); var vb = String.fromCharCode(b[i+36],b[i+37],b[i+38],b[i+39]); log("VBRI check: '" + vb + "'");
        if(tag==="Xing"||tag==="Info"){ var p=i+8+side, fl=(b[p]<<24|b[p+1]<<16|b[p+2]<<8|b[p+3]); log("xing flags "+fl); if(fl&1){ var nf=(b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7])>>>0; log("xing frames "+nf+" -> "+(nf*(v1?1152:576)/hz).toFixed(1)+"s"); } if(fl&2){ var nb=(b[p+8]<<24|b[p+9]<<16|b[p+10]<<8|b[p+11])>>>0; log("xing bytes "+nb); } } }
      frames++; i += len - 1;
    }
  }
  log(info.join("\n"));
}).catch(function(e){ log("fetch failed: " + e); });
</script></body></html>
